name: Upstream Check

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Compare upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          baseline="$(node -p "require('./upstream.json').release")"
          repository="$(node -p "require('./upstream.json').repository")"
          latest="$(gh api "repos/${repository}/releases/latest" --jq .tag_name)"
          echo "Tracked upstream release: ${baseline}"
          echo "Latest upstream release:  ${latest}"
          if [ "${latest}" != "${baseline}" ]; then
            echo "A different upstream release is available; review and update the downstream baseline manually." >&2
            exit 1
          fi
